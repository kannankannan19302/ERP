version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@db:5432/agrierp
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    networks:
      - agrierp-network

  db:
    image: postgres:14
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: agrierp
    ports:
      - 5432:5432
    networks:
      - agrierp-network

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    networks:
      - agrierp-network

networks:
  agrierp-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data: